<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수학자를 이겨라 - 탁구 & 배드민턴 챔피언십</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --floor:#0E1915; --panel:#16241E; --panel-2:#1D2F27; --line:#2C4338;
  --chalk:#EEF3EF; --muted:#A3B5AB; --led:#FFB547; --court:#3FA877; --warn:#F0795B; --strong:#C9A7FF;
  --gold:#FFD700; --gold-bg:linear-gradient(135deg, #2A2408 0%, #4A3E00 50%, #2A2408 100%);
  --font-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --font-led:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--floor);color:var(--chalk);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:10;background:#0A130F;border-bottom:1px solid var(--line);padding:8px 16px}
.topbar .in{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--font-display);font-size:20px;background:none;border:0;color:var(--chalk);cursor:pointer;padding:0}
.brand span{color:var(--led)}
.main{max-width:920px;margin:0 auto;padding:16px}
.wrap{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:.01em}
h1{font-size:clamp(32px,7vw,54px);line-height:1.1}
h2{font-size:clamp(20px,4vw,26px)}
.muted{color:var(--muted)}
.led{font-family:var(--font-led);color:var(--led);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-led);font-size:13px;letter-spacing:.12em;color:var(--court);text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

button{font-family:var(--font-body);font-size:15px;font-weight:700;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--chalk)}
button:hover{border-color:var(--court)}
button.primary{background:var(--led);color:#1A1205;border-color:var(--led)}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}

/* 캐러셀 */
.carousel-wrap{position:relative;display:flex;align-items:center;gap:8px}
.carousel-card{flex:1;min-width:0}
.nav-btn{width:44px;height:70px;border-radius:8px;font-size:22px;padding:0;display:grid;place-items:center;flex-shrink:0}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .2s}
.dot.active{background:var(--led);width:18px;border-radius:4px}

/* 카드 */
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.card.sel{border-color:var(--led);box-shadow:0 0 0 1px var(--led) inset}
.card.locked{opacity:.6}
.card.legendary{background:var(--gold-bg);border:2px solid var(--gold);box-shadow:0 0 15px rgba(255,215,0,.2)}
.card .head{display:flex;gap:12px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:22px;color:#0E1915;overflow:hidden;background:#3FA877;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.side{font-family:var(--font-led);font-size:12px;letter-spacing:.1em}
.side.weak{color:var(--court)} .side.strong{color:var(--strong)} .side.gold{color:var(--gold)}
.card .nm{font-family:var(--font-display);font-size:22px;line-height:1.1}
.bar{height:6px;background:var(--floor);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--court)}
.bar.strong i{background:var(--strong)} .bar.gold i{background:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--floor)}
.chip.game{border-color:#2F5E48;color:#9BE0BC}
.chip.gold{border-color:var(--gold);color:var(--gold)}

/* 경기 및 모달 */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:#07100C;border:2px solid var(--line);border-radius:10px;padding:12px}
.score .s{font-family:var(--font-led);font-size:clamp(36px,8vw,56px);line-height:1;color:var(--led);text-align:center}
.arena{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:16px}
@media(max-width:760px){.arena{grid-template-columns:1fr}}
canvas#court{display:block;width:100%;height:auto;background:#123327;border-radius:8px;touch-action:none}
.hit{font-size:20px;min-height:60px;width:100%}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:grid;place-items:center;padding:16px}
.roulette-box{background:var(--panel);border:2px solid var(--led);border-radius:16px;padding:24px;width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:16px}
.roulette-slot{font-family:var(--font-display);font-size:36px;color:var(--led);min-height:60px;display:grid;place-items:center;background:var(--floor);border-radius:8px;border:1px solid var(--line)}

table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted)} td.num{text-align:right;font-family:var(--font-led)}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <button class="brand" id="homeBtn" type="button">수학자를 <span>이겨라</span></button>
  <span id="topInfo" class="muted" style="font-size:13px"></span>
</div></header>

<main class="main"><div class="wrap" id="app"></div></main>

<!-- 가챠/해금 모달 -->
<div id="modal" class="modal-backdrop" style="display:none">
  <div class="roulette-box">
    <span class="eyebrow">NEW CHARACTER UNLOCKED</span>
    <h2>새로운 수학자 해금!</h2>
    <div class="roulette-slot" id="slotName">???</div>
    <p class="muted" id="slotDesc" style="font-size:14px">뽑기 진행 중...</p>
    <button class="primary" id="modalOkBtn" style="display:none">확인 및 선택</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= 1. 캐릭터 데이터 (각 9명 + 괴델 1명 = 총 19명) ================= */
var ZONE={"클리어":"뒤쪽","드롭":"앞쪽","헤어핀":"앞쪽","스매시":"가운데"};
var W_WIKI={"파스칼":"Blaise Pascal","페르마":"Pierre de Fermat","베르누이":"Jacob Bernoulli","콜모고로프":"Andrey Kolmogorov","마르코프":"Andrey Markov","라플라스":"Pierre-Simon Laplace","카르다노":"Gerolamo Cardano","체비쇼프":"Pafnuty Chebyshev","푸아송":"Siméon Denis Poisson"};
var S_WIKI={"라그랑주":"Joseph-Louis Lagrange","라이프니츠":"Gottfried Wilhelm Leibniz","리만":"Bernhard Riemann","뉴턴":"Isaac Newton","오일러":"Leonhard Euler","가우스":"Carl Friedrich Gauss","데카르트":"René Descartes","코시":"Augustin-Louis Cauchy","푸리에":"Joseph Fourier","괴델":"Kurt Gödel"};

// 주사위파: 약한 그룹 (s: -1.2 ~ -0.8). 스탯 부족 시 errMult(실수율) 감소 or 특수 스킬로 커버하여 그룹 내 밸런스 유지
var WEAK = [
  {id:"w1",nm:"파스칼",title:"확률의 삼각 구도",s:-1.2,errMult:0.8,col:"#C2D0A0",good:"헤어핀",bad:"스매시",stamina:"보통",skills:["scout"],line:"모든 경우의 수를 세어 둡니다."},
  {id:"w2",nm:"페르마",title:"확률론의 창시자",s:-1.1,errMult:0.9,col:"#9FB8AA",good:"클리어",bad:"헤어핀",stamina:"강함",skills:["timeout"],line:"마지막 순간 흐름을 차단합니다."},
  {id:"w3",nm:"베르누이",title:"큰 수의 법칙",s:-1.1,errMult:0.85,col:"#B8C78F",good:"드롭",bad:"스매시",stamina:"약함",skills:["short"],line:"시행이 많을수록 실력이 수렴합니다."},
  {id:"w4",nm:"콜모고로프",title:"확률의 공리화",s:-1.0,errMult:1.0,col:"#A9C98F",good:"드롭",bad:"클리어",stamina:"보통",skills:["both"],line:"공리부터 다시 세워 상대 반응을 늦춥니다."},
  {id:"w5",nm:"마르코프",title:"마르코프 체인",s:-0.9,errMult:0.95,col:"#8FC7A2",good:"클리어",bad:"드롭",stamina:"보통",skills:["timeout"],line:"이전의 연속 실점은 잊고 리셋합니다."},
  {id:"w6",nm:"라플라스",title:"확률의 해석학",s:-0.8,errMult:1.1,col:"#7FB89A",good:"스매시",bad:"헤어핀",stamina:"보통",skills:["head"],line:"성공 추정 확률을 기반으로 타격합니다."},
  {id:"w7",nm:"카르다노",title:"확률의 도박사",s:-1.2,errMult:0.7,col:"#B0C4A4",good:"헤어핀",bad:"클리어",stamina:"약함",skills:["lucky"],line:"주사위의 운을 라켓 끝에 실어 실수를 방지합니다."},
  {id:"w8",nm:"체비쇼프",title:"편차 제어 부등식",s:-1.0,errMult:0.8,col:"#93C0A0",good:"드롭",bad:"헤어핀",stamina:"강함",skills:["bound"],line:"상대 샷의 범위를 부등식 안에 묶어둡니다."},
  {id:"w9",nm:"푸아송",title:"희귀 사건 분포",s:-0.9,errMult:1.0,col:"#A2C8A8",good:"스매시",bad:"드롭",stamina:"보통",skills:["surprise"],line:"예상치 못한 순간 깜짝 위너를 날립니다."}
];

// 방정식파: 강한 그룹 (s: 0.3 ~ 0.8로 기존 대비 다운그레이드)
var STRONG = [
  {id:"s1",nm:"라그랑주",title:"최적화의 대가",s:0.3,errMult:1.1,col:"#9C8BDB",good:"스매시",bad:"헤어핀",stamina:"약함",skills:["smash"],line:"최적의 각도로 스매시를 날립니다."},
  {id:"s2",nm:"라이프니츠",title:"이진법과 미분",s:0.4,errMult:1.0,col:"#A994E6",good:"드롭",bad:"클리어",stamina:"강함",skills:["calm"],line:"판단을 이진화하여 실수를 줄입니다."},
  {id:"s3",nm:"리만",title:"휘어진 기하학",s:0.5,errMult:1.05,col:"#B39DF0",good:"스매시",bad:"드롭",stamina:"약함",skills:["smash"],line:"휘어진 궤적으로 상대를 교란합니다."},
  {id:"s4",nm:"뉴턴",title:"만유인력과 역학",s:0.7,errMult:0.9,col:"#BBA5F5",good:"스매시",bad:"클리어",stamina:"강함",skills:["calm"],line:"외부 충격에도 흔들리지 않습니다."},
  {id:"s5",nm:"오일러",title:"수학의 다작왕",s:0.6,errMult:1.0,col:"#C4AEFA",good:"클리어",bad:"헤어핀",stamina:"약함",skills:["smash"],line:"끊임없는 연타로 빈틈을 노립니다."},
  {id:"s6",nm:"가우스",title:"수학의 왕자",s:0.8,errMult:0.85,col:"#D4C0FF",good:"스매시",bad:"클리어",stamina:"강함",skills:["calm"],line:"방정식파 최고 레벨의 정밀도."},
  {id:"s7",nm:"데카르트",title:"좌표계의 창시자",s:0.4,errMult:0.95,col:"#B5A3E8",good:"드롭",bad:"헤어핀",stamina:"보통",skills:["coordinate"],line:"상대 코트를 좌표계로 정확히 분할합니다."},
  {id:"s8",nm:"코시",title:"해석학의 극한",s:0.5,errMult:0.9,col:"#A08CE0",good:"클리어",bad:"스매시",stamina:"강함",skills:["limit"],line:"극한의 인내심으로 실수를 통제합니다."},
  {id:"s9",nm:"푸리에",title:"파동과 급수",s:0.6,errMult:1.0,col:"#A898E5",good:"드롭",bad:"클리어",stamina:"보통",skills:["wave"],line:"공의 궤적에 정현파 파동을 실어 보냅니다."}
];

// 레전더리
var LEGENDARY = {
  id:"g0",nm:"배드민턴마스터괴델",title:"불완전성 정리",s:1.8,errMult:0.2,col:"#FFD700",good:"스매시",bad:"없음",stamina:"최상",skills:["incompleteness"],line:"이 코트 안의 어떤 법칙도 나를 증명하여 이길 수 없다."
};

var SKILLS = {
  scout:{nm:"약점 집중",desc:"3랠리 동안 상대 약점 구역 공격 시 상대 반응 지연"},
  timeout:{nm:"타임아웃",desc:"상대의 흐름을 끊고 템포 초기화"},
  short:{nm:"목표 단축",desc:"목표 점수를 줄여(21→11, 11→7) 변수 극대화"},
  both:{nm:"공리 재설정",desc:"상대의 다음 2랠리 이동 속도 -20%"},
  head:{nm:"선취점 제안",desc:"경기 시작 시 1점 선제 획득"},
  lucky:{nm:"도박사의 운",desc:"다음 5랠리 동안 실수 확률 0%"},
  bound:{nm:"부등식 영역",desc:"내 코트로 오는 공의 라인 아웃 확률 증가"},
  surprise:{nm:"희귀 위너",desc:"즉시 강력한 스매시 발동"},
  smash:{nm:"강력 스매시",desc:"3랠리 동안 스피드 및 정밀도 대폭 증가"},
  calm:{nm:"평정심",desc:"4랠리 동안 실수 확률 50% 감소"},
  coordinate:{nm:"좌표 공격",desc:"구석 빈 공간으로 정확한 송구"},
  limit:{nm:"극한 통제",desc:"상대의 이동 속도를 순간 감소"},
  wave:{nm:"파동 궤적",desc:"공이 요동치며 상대 타이밍 혼선"},
  incompleteness:{nm:"불완전성 정리",desc:"상대 스킬 완전 봉인 & 내 속도 2배, 상대 속도 -50%"}
};

function getAllChars(){ return WEAK.concat(STRONG).concat([LEGENDARY]); }
function getChar(id){ return getAllChars().find(c=>c.id===id)||WEAK[0]; }
function isWeak(c){ return c.id.startsWith("w"); }

/* ================= 2. 게임 상태 및 저장 ================= */
var UNLOCK_REQ = { pts: 800, games: 12 };

var S = {
  unlocked: [], // 해금된 캐릭터 ID 목록
  char: "",     // 현재 플레이어 캐릭터 ID
  opp: "",      // 현재 상대 ID
  pts: 0,       // 총 포인트
  games: 0,     // 총 경기 수
  wins: 0,      // 승리 수
  // 해금 진행 관련 (최근 해금 시점 이후 누적)
  progressBase: { pts: 0, games: 0 },
  hasStrongUnlocked: false, // 방정식파 1명 이상 해금 여부
  
  // UI 상태
  weakIdx: 0,
  strongIdx: 0,
  screen: "intro",
  nick: "",
  hall: [] // 명예의 전당
};

function initGame(){
  var saved = localStorage.getItem("math_pingpong_save_v2");
  if(saved){
    try{
      var parsed = JSON.parse(saved);
      S.unlocked = parsed.unlocked || [];
      S.char = parsed.char || "";
      S.pts = parsed.pts || 0;
      S.games = parsed.games || 0;
      S.wins = parsed.wins || 0;
      S.progressBase = parsed.progressBase || {pts:0, games:0};
      S.hasStrongUnlocked = parsed.hasStrongUnlocked || false;
      S.hall = parsed.hall || [];
      S.nick = parsed.nick || "";
      S.tutorialDone = !!parsed.tutorialDone;
      S.logs = parsed.logs || [];
    }catch(e){}
  }
  
  // 처음 시작 시: 주사위파 중 무작위 2명 해금
  if(!S.unlocked || S.unlocked.length < 2){
    var shuffledWeak = WEAK.slice().sort(()=>Math.random()-0.5);
    S.unlocked = [shuffledWeak[0].id, shuffledWeak[1].id];
    S.char = S.unlocked[0];
    saveGame();
  }
  updateTopInfo();
}

function saveGame(){
  var data = {
    unlocked: S.unlocked, char: S.char, pts: S.pts, games: S.games, wins: S.wins,
    progressBase: S.progressBase, hasStrongUnlocked: S.hasStrongUnlocked, hall: S.hall, nick: S.nick, tutorialDone: !!S.tutorialDone, logs: S.logs || []
  };
  localStorage.setItem("math_pingpong_save_v2", JSON.stringify(data));
  updateTopInfo();
}

function updateTopInfo(){
  var el = document.getElementById("topInfo");
  if(el) el.innerHTML = `포인트: <b class="led">${S.pts}</b> | 경기: <b class="led">${S.games}</b> (${S.wins}승) | 해금: <b class="led">${S.unlocked.length}/18</b>`;
}

/* ================= 3. 위키 초상화 로더 ================= */
var portraitCache = {};
function loadPortraits(){
  document.querySelectorAll('.avatar[data-person]').forEach(el => {
    var nm = el.getAttribute('data-person');
    if(!nm || el.getAttribute('data-loaded')) return;
    el.setAttribute('data-loaded', '1');
    var title = W_WIKI[nm] || S_WIKI[nm];
    if(!title) return;
    if(portraitCache[title]){ setImg(el, portraitCache[title]); return; }
    
    fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=160&titles='+encodeURIComponent(title))
      .then(r => r.json()).then(data => {
        var pages = data.query && data.query.pages;
        if(!pages) return;
        var url = "";
        Object.keys(pages).forEach(k => { if(pages[k].thumbnail) url = pages[k].thumbnail.source; });
        if(url){ portraitCache[title] = url; setImg(el, url); }
      }).catch(()=>{});
  });
}
function setImg(el, url){
  el.innerHTML = `<img src="${url}" alt="초상화">`;
}

/* ================= 4. 메인 UI 화면 구성 ================= */
function render(){
  var app = document.getElementById("app");
  if(S.screen === "intro") renderIntro(app);
  else if(S.screen === "tutorial") renderTutorial(app);
  else if(S.screen === "select") renderSelect(app);
  else if(S.screen === "opp") renderOpp(app);
  else if(S.screen === "guess") renderGuess(app);
  else if(S.screen === "reveal") renderReveal(app);
  else if(S.screen === "play") renderPlay(app);

}

function renderCardHtml(c){
  var isUnlocked = S.unlocked.includes(c.id) || (c.id === "g0" && S.unlocked.length >= 18);
  var isSelected = S.char === c.id;
  var isLegend = c.id === "g0";
  var statPct = Math.round((c.s + 1.5)/3.3 * 100);

  return `
  <div class="card ${isSelected?'sel':''} ${!isUnlocked?'locked':''} ${isLegend?'legendary':''}">
    <div class="head">
      <div class="avatar" data-person="${c.nm}">${c.nm.charAt(0)}</div>
      <div style="flex:1">
        <div class="side ${isLegend?'gold':(isWeak(c)?'weak':'strong')}">${isLegend?'LEGENDARY':(isWeak(c)?'주사위파':'방정식파')} · ${c.title}</div>
        <div class="nm">${c.nm}</div>
      </div>
      ${isUnlocked ? 
        `<button class="pick-btn ${isSelected?'primary':''}" data-id="${c.id}">${isSelected?'선택됨':'선택'}</button>` : 
        `<button disabled>🔒 잠김</button>`}
    </div>
    <p class="muted" style="font-size:13px">${c.line}</p>
    <div>
      <div class="muted" style="font-size:12px">능력치 (${statPct}%)</div>

      <dt>약점</dt><dd>${c.bad}</dd>

function bindCardPickBtns(){
  document.querySelectorAll(".pick-btn").forEach(btn => {
    btn.onclick = (e) => {
      var id = e.target.getAttribute("data-id");
      if(S.unlocked.includes(id) || (id === "g0" && S.unlocked.length >= 18)){
        S.char = id;
        saveGame();
        render();
      }
    };
  });
}

function renderHallHtml(){
  if(!S.hall || S.hall.length === 0){
    return `<p class="muted" style="font-size:13px">아직 기록이 없습니다. 경기를 완료하여 명예의 전당에 점수를 등록해보세요!</p>`;
  }
  var sorted = S.hall.slice().sort((a,b)=>b.pts - a.pts).slice(0, 10);
  return `
  <table>
    <thead><tr><th>순위</th><th>플레이어 / 캐릭터</th><th class="num">포인트</th><th class="num">경기수</th></tr></thead>

      ${sorted.map((item, idx) => `
        <tr>
          <td class="led" style="color:${idx===0?'#FFD700':idx===1?'#C0C0C0':idx===2?'#CD7F32':'inherit'}">${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':idx+1}</td>

          <td class="num">${item.pts}</td>
          <td class="num">${item.games}</td>

    </tbody>
  </table>
  `;

/* ================= 5. 가챠/해금 룰렛 시스템 ================= */
function triggerRandomUnlock(){
  var lockedList = getAllChars().filter(c => c.id !== "g0" && !S.unlocked.includes(c.id));
  if(lockedList.length === 0) return;

  var modal = document.getElementById("modal");
  var slotName = document.getElementById("slotName");
  var slotDesc = document.getElementById("slotDesc");
  var okBtn = document.getElementById("modalOkBtn");

  modal.style.display = "grid";
  okBtn.style.display = "none";
  slotDesc.textContent = "방정식파 & 주사위파 통합 가챠 회전 중...";

  var counter = 0;
  var speed = 50;
  var winner = lockedList[Math.floor(Math.random() * lockedList.length)];

  function spin(){
    var randomTmp = lockedList[Math.floor(Math.random() * lockedList.length)];
    slotName.textContent = randomTmp.nm;
    counter++;
    if(counter < 25){
      setTimeout(spin, speed);
    } else {
      // 당첨 처리
      slotName.textContent = "🎉 " + winner.nm;
      slotDesc.textContent = `[${isWeak(winner)?'주사위파':'방정식파'}] ${winner.title} 해금 완료!`;
      okBtn.style.display = "block";

      S.unlocked.push(winner.id);
      if(!isWeak(winner)) S.hasStrongUnlocked = true;
      
      // 해금 후 누적 기준점 초기화 (다시 조건을 채워야 함)
      S.progressBase.pts = S.pts;
      S.progressBase.games = S.games;
      
      saveGame();

      okBtn.onclick = () => {
        modal.style.display = "none";
        S.char = winner.id;
        render();
      };
    }
  }
  spin();
}

        '<dl class="kv"><dt>이동 속도</dt><dd>'+speedOf(o.s).toFixed(2)+' m/s (나 '+speedOf(me.s).toFixed(2)+')</dd><dt>실수 확률</dt><dd>타구당 '+(errOf(o)*100).toFixed(1)+'% (나 '+(errOf(me)*100).toFixed(1)+'%)</dd><dt>주특기</dt><dd>'+o.good+' ('+(ZONE[o.good]||"-")+')</dd><dt>약점</dt><dd>'+o.bad+' ('+(ZONE[o.bad]||"없음")+' 구역)</dd><dt>체력</dt><dd>'+o.stamina+'</dd><dt>스킬</dt><dd>'+o.skills.map(function(k){return SKILLS[k]?SKILLS[k].nm+' — '+SKILLS[k].desc:k}).join(", ")+'</dd></dl>'+
        (tips.length?'<div class="chips">'+tips.map(function(t){return '<span class="chip">'+t+'</span>'}).join("")+'</div>':'')+
        '<button class="primary opp-pick" data-id="'+o.id+'">이 상대와 경기</button>'+

    }).join("")+'</div>'+

  document.getElementById("oppBack").onclick=function(){S.screen="select";render()};
  document.querySelectorAll(".opp-pick").forEach(function(b){b.onclick=function(){S.opp=b.getAttribute("data-id");newCond();S.guess=S.guess==null?50:S.guess;S.screen="guess";render()}});
}

/* ================= 5-3. 규칙 무작위 배정 → 승률 짐작 → 컴퓨터 예측 =================
   경기의 70%는 기본 11점, 15%는 21점, 15%는 비대칭 핸디캡(목표점수와 약자 선취점을 함께 조정)으로 무작위 배정한다.
   사람이 고르지 않고 무작위로 정해야 규칙의 효과를 공정하게 비교할 수 있다. */
var fairCache={};
function fairRule(p){p=Math.max(p,1-p);var key=p.toFixed(3);if(fairCache[key])return fairCache[key];
  var best=null,bs=1e9;
  for(var T=11;T<=40;T++)for(var h=0;h<T-1;h++){var w=exactAB(p,T,0,h);
    var ex=expRallies(p,T,0,h),sc=Math.abs(w-0.5)*10+Math.abs(ex-37.2)/37.2;if(sc<bs){bs=sc;best={T:T,h:h}}}
  return fairCache[key]=best}
function expRallies(q,T,hA,hB){var cap=T+9,E={};
  function f(a,b){var k=a*100+b;if(k in E)return E[k];var e;
    if(a>=cap||b>=cap||(a>=T&&a-b>=2)||(b>=T&&b-a>=2))e=0;else e=1+q*f(a+1,b)+(1-q)*f(a,b+1);return E[k]=e}
  return f(hA,hB)}
function newCond(){
  var me=getChar(S.char),opp=getChar(S.opp),q=baseQ(me,opp),r=Math.random();
  var meUnder=q<0.5;
  if(r<0.70)S.cond={name:"기본",T:TARGET,hUnder:0};
  else if(r<0.85)S.cond={name:"21점",T:21,hUnder:0};
  else{var f=fairRule(q);S.cond={name:"비대칭",T:f.T,hUnder:f.h}}
  S.cond.meUnder=meUnder;
  S.matchId="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function condLabel(c){return c.name==="기본"?"기본 11점":c.name==="21점"?"21점 게임":"비대칭 핸디캡 · "+c.T+"점, 약자 "+c.hUnder+"점 선취"}
function matchPrediction(){
  var me=getChar(S.char),opp=getChar(S.opp),q=baseQ(me,opp),c=S.cond||{name:"기본",T:TARGET,hUnder:0,meUnder:q<0.5};
  var hA=(c.meUnder?c.hUnder:0)+(me.skills[0]==="head"?1:0),hB=c.meUnder?0:c.hUnder;
  return {q:q,T:c.T,hA:hA,hB:hB,win:exactAB(q,c.T,hA,hB),win0:exactAB(q,TARGET,0,0),cond:c};
}
function renderGuess(app){

  app.innerHTML=
  '<div class="panel" style="gap:16px">'+

    '<p class="muted">두 선수의 정보와 규칙을 떠올리며 직감으로 정해 보자. 컴퓨터 예측과 가까울수록 정확도 점수가 높다.</p>'+

    '<div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px">0% 절대 못 이김</span><span class="muted" style="font-size:13px">100% 무조건 이김</span></div>'+

function renderReveal(app){

  '</div>';
  document.getElementById("goPlay").onclick=function(){S.screen="play";render()};

/* ================= 5-4. 경기 기록 (탐구 자료) =================
   깃허브 페이지에서 기록을 모으려면 구글 Apps Script 웹 앱 주소를 ENDPOINT에 넣는다. 비워 두면 이 브라우저에만 저장된다. */
var ENDPOINT="https://script.google.com/macros/s/AKfycbyhv2NolMc4GutwY3dA2eUbDT67ocbtXRNvCD_H0ctbTDfnXNKQG6bfMHkU2DjYHxUg/exec";
function playerId(){try{var v=localStorage.getItem("mtw_player_id");if(!v){v="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);localStorage.setItem("mtw_player_id",v)}return v}catch(e){return "unknown"}}

function recordMatch(iWon){

    a:G.a,b:G.b,rallies:G.n,won:iWon,humanRallies:human,humanRate:rate==null?"":+rate.toFixed(4),
    perfect:st.perfect,good:st.good,late:st.late,whiff:st.whiff,missed:st.missed,err:st.err,out:st.out,net:st.net,winners:st.winners,oppErr:st.oppErr,
    serveFault:st.serveFault,netTouch:st.netTouch,accelRallies:st.accelRallies,points:iWon?150:30,seq:G.seq.join(""),

/* ================= 6. 실시간 경기 엔진 (원래 엔진 + 마우스 이동 + 가속 ×2.5) =================
   코트: 폭 5.2m, 길이 13.4m. 상대 y 0~6.7, 나 y 6.7~13.4, 네트 y=6.7.
   셔틀콕 속도는 타구마다 0.8·1·1.5·2·2.5배 중 무작위로 정해진다. 내 선수의 이동 속도는 기준 봇 계산에도 똑같이 1.6배를 적용한다. */
var CW=5.2,CL=13.4,NET=6.7,REACH=0.75,HOME_ME={x:2.6,y:10.3},HOME_OP={x:2.6,y:3.1};
var SPEEDS=[0.8,1,1.5,2,2.5],TARGET=11,PLAYER_SPEED_MULT=1.6;
function shotMult(){return SPEEDS[Math.floor(Math.random()*SPEEDS.length)]}
function speedOf(s){return 3.7+0.5*s}
function reactOf(s){return 0.3-0.03*s}
function errOf(c){return Math.max(0.015,Math.min(0.1,0.07-0.02*(c.s+1.5)))*(c.errMult||1)}
function rnd(){return Math.random()}
function gauss(){var u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function toward(p,goal,d){var D=dist(p,goal);if(D<=d)return {x:goal.x,y:goal.y};return {x:p.x+(goal.x-p.x)/D*d,y:p.y+(goal.y-p.y)/D*d}}
function zoneOfOpp(L){return L.y>NET-2.0?"앞쪽":L.y<1.6?"뒤쪽":"가운데"}
/* 상대가 나에게 보내는 샷 */
function aiShot(op,from,mePos,o){
  o=o||{};
  var w={"클리어":1,"드롭":1,"스매시":from.y<NET-2.5?1:0.3,"헤어핀":from.y>NET-1.8?1.2:0.1};
  if(w[op.good]!=null)w[op.good]*=2.2;
  var tot=0,k;for(k in w)tot+=w[k];var t=rnd()*tot,type="클리어";for(k in w){if(t<w[k]){type=k;break}t-=w[k]}
  var y={"클리어":12.2+rnd()*0.9,"드롭":7.3+rnd()*1.3,"스매시":9.5+rnd()*2.5,"헤어핀":6.95+rnd()*0.6}[type];
  var away=o.precise?true:rnd()<Math.min(0.85,0.55+0.1*(op.s+1.5));
  var x=away?(mePos.x<CW/2?3.4+rnd()*1.5:0.3+rnd()*1.5):0.4+rnd()*4.4;
  var sig=Math.max(0.12,0.45-0.08*(op.s+1.5));if(o.precise)sig*=0.5;
  var L={x:Math.max(0.15,Math.min(CW-0.15,x+gauss()*sig*0.5)),y:Math.max(NET+0.2,Math.min(CL-0.15,y+gauss()*sig*0.5))};
  var tf=Math.max(0.65,{"클리어":1.7,"드롭":1.35,"스매시":0.9,"헤어핀":1.2}[type]*(1-0.05*op.s));
  if(o.fast)tf*=0.85;
  tf/=(o.mult||1);
  return {type:type,L:L,tf:tf};
}
/* 내가 친 샷의 착지점과 비행 시간 */
function myShot(me,mePos,aim,Q,o){
  o=o||{};
  var sig=Math.max(0.15,0.25+0.6*(1-Q)-0.05*(me.s+1.5));
  if(o.precise)sig*=0.4;
  var L={x:aim.x+gauss()*sig,y:aim.y+gauss()*sig};
  var out=L.x<0||L.x>CW||L.y<0,net=L.y>NET-0.08;
  var tf=Math.max(0.7,Math.min(1.9,0.95+0.07*dist(mePos,L)-0.35*Q));
  if(o.fast)tf=Math.max(0.6,tf-0.2);
  tf/=(o.mult||1);
  return {L:L,tf:tf,out:out,net:net};
}
/* 상대가 내 샷을 받을 수 있는가 */
function oppCanReach(op,opPos,L,tf,o){
  o=o||{};
  var v=speedOf(op.s)*(o.speed||1),r=REACH,z=zoneOfOpp(L);
  if(ZONE[op.bad]===z)r-=o.scout?0.45:0.25;
  if(ZONE[op.good]===z)r+=0.15;
  r+=o.reachAdd||0;
  return dist(opPos,L)<=v*Math.max(0,tf-reactOf(op.s)-(o.reactAdd||0))+r;
}
/* 기준 봇: 평균 실력 플레이어가 같은 엔진·같은 가속 규칙으로 칠 때 */
function botAim(opPos){return {x:opPos.x<CW/2?3.8+rnd():0.4+rnd(),y:rnd()<0.5?0.6+rnd():NET-1.6+rnd()*0.9}}
function botRally(me,op,meServes){
  var mePos={x:HOME_ME.x,y:HOME_ME.y},opPos={x:HOME_OP.x,y:HOME_OP.y},vMe=speedOf(me.s)*PLAYER_SPEED_MULT,vOp=speedOf(op.s),hits=0,inc=null,myTurn=meServes;
  if(!meServes){inc=aiShot(op,opPos,mePos,{mult:shotMult()});hits++}
  for(var ex=0;ex<80;ex++){
    if(!myTurn){
      if(dist(mePos,inc.L)>vMe*Math.max(0,inc.tf-reactOf(me.s))+REACH)return 0;
      var dt=gauss()*0.14,Q=Math.abs(dt)<=0.08?1:Math.abs(dt)<=0.18?0.7:0.4;
      if(rnd()<errOf(me)*(Q<0.5?1.8:1))return 0;
      mePos={x:inc.L.x,y:inc.L.y};opPos=toward(opPos,HOME_OP,vOp*inc.tf);
      var sh=myShot(me,mePos,botAim(opPos),Q,{mult:shotMult()});hits++;
      if(sh.out||sh.net)return 0;
      if(!oppCanReach(op,opPos,sh.L,sh.tf))return 1;
      if(rnd()<errOf(op))return 1;
      opPos={x:sh.L.x,y:sh.L.y};mePos=toward(mePos,HOME_ME,vMe*sh.tf);
      inc=aiShot(op,opPos,mePos,{mult:shotMult()});hits++;
    }else{
      var sv=myShot(me,mePos,{x:opPos.x<CW/2?3.6:1.6,y:2.0+rnd()*1.5},0.7,{});hits++;
      if(sv.out||sv.net)return 0;
      if(!oppCanReach(op,opPos,sv.L,sv.tf))return 1;
      if(rnd()<errOf(op))return 1;
      opPos={x:sv.L.x,y:sv.L.y};inc=aiShot(op,opPos,mePos,{mult:shotMult()});hits++;myTurn=false;
    }
  }
  return rnd()<0.5?1:0;
}
/* 마르코프 체인 정확해: 목표 T점, 둘 다 T-1이면 2점 차, T+9점이면 즉시 승리 */
function exactAB(q,T,hA,hB){
  var cap=T+9,W={};
  function f(a,b){var k=a*100+b;if(k in W)return W[k];var w;
    if(a>=cap)w=1;else if(b>=cap)w=0;else if(a>=T&&a-b>=2)w=1;else if(b>=T&&b-a>=2)w=0;else w=q*f(a+1,b)+(1-q)*f(a,b+1);
    return W[k]=w}
  return f(hA,hB);
}
var qCache={};
function baseQ(me,op){var k=me.id+op.id;if(qCache[k]!=null)return qCache[k];var w=0,N=4000;for(var i=0;i<N;i++)w+=botRally(me,op,i%2===0);return qCache[k]=w/N}

document.addEventListener("keydown",function(e){

function mySpeed(){var v=speedOf(G.me.s)*PLAYER_SPEED_MULT;if(G.eff.boost>0)v*=2;if(G.oppEff.slowMe>0)v*=0.8;if(G.me.stamina==="약함"&&G.n>=30)v*=0.88;return v}
function oppSpeed(){var v=1;if(G.eff.slowOpp>0)v*=G.eff.slowOppMul||0.8;if(G.opp.stamina==="약함"&&G.n>=30)v*=0.85;return v}
function myErr(){if(G.eff.lucky>0)return 0;var e=errOf(G.me);if(G.eff.calm>0)e/=2;return e}
function oppErr(){var e=errOf(G.opp);if(G.oppEff.calm>0)e/=2;return e}

function chaos(){
  var errMe=isWeak(G.me)?0.03:0.012,errOp=isWeak(G.opp)?0.03:0.012,r=rnd();
  if(G.servingMe&&r<errMe){G.stat.serveFault++;return {won:false,msg:"서브 미스! 셔틀콕이 네트에 걸렸다."}}
  if(!G.servingMe&&r<errOp){G.stat.serveFault++;return {won:true,msg:G.opp.nm+"의 서브 미스. 공짜 득점!"}}
  r=rnd();
  if(r<0.01){G.stat.netTouch++;return {won:true,msg:G.opp.nm+"이(가) 네트를 건드렸다. 네트 터치로 득점!"}}
  if(r<0.02){G.stat.netTouch++;return {won:false,msg:"내 라켓이 네트에 닿았다. 네트 터치로 실점."}}
  return null;
}
function nextRally(){
  if(G.done)return;
  G.hits=0;setAccelTag();
  if(G.mode==="auto"){var w=botRally(G.me,G.opp,G.servingMe);G.autoRallies++;G.msg="자동 진행: "+(w?"득점":"실점");point(!!w);return}
  G.mePos={x:HOME_ME.x,y:HOME_ME.y};G.target={x:HOME_ME.x,y:HOME_ME.y};G.opPos={x:HOME_OP.x,y:HOME_OP.y};G.fly=null;G.swing=null;
  var c=chaos();if(c){G.msg=c.msg;point(c.won);return}
  aiSkill();
  if(G.servingMe){G.phase="serve";G.msg="내 서브. 상대 코트를 클릭해 조준하고 Space 또는 치기.";G.serveDeadline=now()+5}
  else{G.msg=G.opp.nm+"의 서브.";oppHit()}
}
function setAccelTag(){var t=document.getElementById("speedTag");if(!t)return;var m=G.fly&&G.fly.mult;t.style.display=m?"inline-block":"none";if(m)t.textContent="셔틀 ×"+m}
function oppHit(){
  if(G.oppEff.bound>0&&rnd()<0.25){G.msg=G.opp.nm+"의 샷이 라인 밖으로! (부등식 영역)";G.phase="pause";point(true);return}
  var m=shotMult();
  var sh=aiShot(G.opp,G.opPos,G.mePos,{fast:G.oppEff.fast>0,precise:G.oppEff.precise>0,mult:m});
  G.hits++;if(m>=2)G.stat.accelRallies++;
  G.phase="incoming";G.fly={from:{x:G.opPos.x,y:G.opPos.y},to:sh.L,t0:now(),tf:sh.tf,type:sh.type,mine:false,mult:m};setAccelTag();
  G.msg=G.opp.nm+": "+sh.type+"! (셔틀 ×"+m+")";
}
function swing(){
  if(!G||G.done||G.mode!=="direct")return;
  var t=now();
  if(G.phase==="serve"){myHit(0.7,true);return}
  if(G.phase!=="incoming"||!G.fly)return;
  var ta=G.fly.t0+G.fly.tf,dt=t-ta;
  if(dt<-0.35)return;
  if(dist(G.mePos,G.fly.to)>REACH){G.stat.whiff++;G.msg="헛스윙! 셔틀콕에 닿지 않았다. 실점.";G.swing={t:t,miss:true};point(false);return}
  var a=Math.abs(dt),Q=a<=0.08?1:a<=0.18?0.7:0.4;
  if(G.dts.length<300)G.dts.push(dt);
  if(Q===1)G.stat.perfect++;else if(Q===0.7)G.stat.good++;else G.stat.late++;
  G.swing={t:t,Q:Q};myHit(Q,false);
}
function myHit(Q,isServe){
  if(G.eff.surprise){Q=1}
  if(rnd()<myErr()*(Q<0.5?1.8:1)){G.stat.err++;G.msg=(Q===1?"완벽한 타점이었지만":"타점이 흔들려")+" 네트에 걸렸다. 실점.";point(false);return}
  var aim=isServe?{x:G.aim.x,y:Math.min(G.aim.y,NET-2.0)}:G.aim;
  if(G.eff.coord>0)aim={x:G.opPos.x<CW/2?CW-0.5:0.5,y:G.opPos.y<NET/2?NET-1.2:0.6};
  var mm=shotMult();
  var sh=myShot(G.me,G.mePos,aim,Q,{fast:G.eff.smash>0||G.eff.surprise,precise:G.eff.smash>0||G.eff.coord>0||G.eff.surprise,mult:mm});
  G.hits++;
  if(sh.net){G.stat.net++;G.msg="네트에 너무 가깝게 노렸다. 걸렸다. 실점.";point(false);return}
  var label=isServe?"서브":(Q===1?"완벽한 타점!":Q===0.7?"좋은 타점":"늦은 타점");
  if(sh.out){G.stat.out++;G.phase="outgoing";G.fly={from:{x:G.mePos.x,y:G.mePos.y},to:sh.L,t0:now(),tf:sh.tf,mine:true,out:true,mult:mm,oppFrom:{x:G.opPos.x,y:G.opPos.y}};setAccelTag();G.msg=label+"… 라인 밖으로 나간다!";return}
  var reach=oppCanReach(G.opp,G.opPos,sh.L,sh.tf,{speed:oppSpeed(),scout:G.eff.scout>0,reactAdd:G.eff.wave>0?0.25:0,reachAdd:(G.eff.surprise?-0.5:0)+(G.oppEff.reach>0?0.2:0)});
  G.eff.surprise=false;
  G.phase="outgoing";G.fly={from:{x:G.mePos.x,y:G.mePos.y},to:sh.L,t0:now(),tf:sh.tf,mine:true,reach:reach,mult:mm,oppFrom:{x:G.opPos.x,y:G.opPos.y}};setAccelTag();
  G.msg=label+(ZONE[G.opp.bad]===zoneOfOpp(sh.L)?" · 상대 약점 구역!":"");
}
function point(won){
  if(won)G.a++;else G.b++;
  G.n++;G.seq.push(won?1:0);G.servingMe=won;
  [G.eff,G.oppEff].forEach(function(E){Object.keys(E).forEach(function(k){if(typeof E[k]==="number"&&E[k]>0)E[k]--})});
  G.phase="pause";G.fly=null;
  var T=G.T,cap=T+9,over=null;
  if(G.a>=cap||(G.a>=T&&G.a-G.b>=2))over=1;else if(G.b>=cap||(G.b>=T&&G.b-G.a>=2))over=0;
  paintScore();
  if(G.pending){clearTimeout(G.pending);G.pending=null}
  var g=G;
  if(over!==null){G.done=true;G.pending=setTimeout(function(){g.pending=null;if(S.screen==="play"&&G===g){stopGame();recordMatch(over===1);finishMatch(over===1)}},1300);return}
  G.pending=setTimeout(function(){g.pending=null;if(alive(g))nextRally()},G.mode==="auto"?150:1100);
}
function flash(t){G.flash={t:t,until:now()+2}}
function usePlayerSkill(){
  if(!G||G.used||G.done)return;
  var sk=G.me.skills[0];if(!sk)return;
  if(G.sealed){flash("불완전성 정리에 봉인되어 스킬을 쓸 수 없다.");return}
  G.used=true;G.skillAt=G.n;var b=document.getElementById("skillBtn");if(b){b.disabled=true;b.textContent=SKILLS[sk].nm+" 사용 완료"}
  var nm=SKILLS[sk].nm;
  if(sk==="scout"){G.eff.scout=3;flash(nm+": 3랠리 동안 "+ZONE[G.opp.bad]+" 구역이 더 받기 어려워진다.")}
  else if(sk==="timeout"){G.oppEff={};flash(nm+": 상대의 흐름과 효과를 끊었다.")}
  else if(sk==="short"){var nt=G.T>11?11:7;if(G.T>7&&G.a<nt-1&&G.b<nt-1){G.T=nt;flash(nm+": 이번 게임은 "+nt+"점에서 끝난다.")}else flash(nm+": 점수가 이미 높아 효과가 없다.")}
  else if(sk==="both"){G.eff.slowOpp=2;G.eff.slowOppMul=0.8;flash(nm+": 2랠리 동안 상대 이동 속도 -20%.")}
  else if(sk==="lucky"){G.eff.lucky=5;flash(nm+": 5랠리 동안 실수 0%.")}
  else if(sk==="bound"){G.oppEff.bound=5;flash(nm+": 5랠리 동안 상대 샷이 라인 밖으로 나가기 쉬워진다.")}
  else if(sk==="surprise"){G.eff.surprise=true;flash(nm+": 다음 타구는 강력한 위너 샷.")}
  else if(sk==="smash"){G.eff.smash=3;flash(nm+": 3랠리 동안 빠르고 정확한 샷.")}
  else if(sk==="calm"){G.eff.calm=4;flash(nm+": 4랠리 동안 실수 절반.")}
  else if(sk==="coordinate"){G.eff.coord=3;flash(nm+": 3랠리 동안 상대 반대편 구석으로 정확히 보낸다.")}
  else if(sk==="limit"){G.eff.slowOpp=2;G.eff.slowOppMul=0.6;flash(nm+": 2랠리 동안 상대 이동 속도 -40%.")}
  else if(sk==="wave"){G.eff.wave=3;flash(nm+": 3랠리 동안 상대 반응이 늦어진다.")}
  else if(sk==="incompleteness"){G.oppSealed=true;G.oppEff={};G.eff.boost=6;G.eff.slowOpp=6;G.eff.slowOppMul=0.5;flash(nm+": 상대 스킬 봉인, 내 속도 2배, 상대 속도 -50%.")}
  else if(sk==="head"){flash(nm+": 이미 적용됐다.")}
}
function aiSkill(){
  var o=G.opp,sk=o.skills[0];
  if(G.oppUsed||G.oppSealed||!sk)return;
  if(!(G.b+3<=G.a||G.b>=G.T-4||(G.a>=8&&rnd()<0.15)))return;
  G.oppUsed=true;var nm=SKILLS[sk]?SKILLS[sk].nm:"스킬";
  if(sk==="smash"||sk==="wave"||sk==="surprise"){G.oppEff.fast=3}
  else if(sk==="calm"||sk==="lucky"){G.oppEff.calm=4}
  else if(sk==="coordinate"){G.oppEff.precise=3}
  else if(sk==="both"||sk==="limit"){G.oppEff.slowMe=2}
  else if(sk==="timeout"){G.eff={}}
  else if(sk==="incompleteness"){G.sealed=true;G.eff={};G.oppEff.fast=6;G.oppEff.slowMe=6}
  else{G.oppEff.reach=3}
  flash(o.nm+"의 "+nm+"!");
}
function update(dt){
  if(G.done||G.mode!=="direct")return;
  G.mePos=toward(G.mePos,G.target,mySpeed()*dt);
  var t=now();
  if(G.phase==="serve"&&t>G.serveDeadline){myHit(0.7,true);return}
  if(G.phase==="incoming"&&G.fly&&t>G.fly.t0+G.fly.tf+0.25){
    G.stat.missed++;G.msg=dist(G.mePos,G.fly.to)>REACH?"셔틀콕이 바닥에 떨어졌다. 실점.":"치지 못했다. 타점을 놓쳤다. 실점.";point(false);return}
  if(G.phase==="outgoing"&&G.fly){
    var f=G.fly,k=Math.min(1,(t-f.t0)/f.tf);
    if(f.reach)G.opPos=toward(f.oppFrom,f.to,dist(f.oppFrom,f.to)*Math.min(1,k*1.05));
    else G.opPos=toward(f.oppFrom,f.to,speedOf(G.opp.s)*oppSpeed()*Math.max(0,(t-f.t0)-reactOf(G.opp.s)));
    if(k>=1){
      if(f.out){G.msg="아웃! 실점.";point(false);return}
      if(!f.reach){G.stat.winners++;G.msg="위너! "+G.opp.nm+"이(가) 따라가지 못했다.";point(true);return}
      if(rnd()<oppErr()){G.stat.oppErr++;G.msg=G.opp.nm+"의 실수! 득점.";point(true);return}
      G.opPos={x:f.to.x,y:f.to.y};oppHit();
    }
  }
  if(G.phase==="incoming")G.opPos=toward(G.opPos,HOME_OP,speedOf(G.opp.s)*0.6*dt);
}
function gameLoop(){
  if(S.screen!=="play"||!G)return;
  var t=now(),dt=Math.min(0.05,t-(G.lastT||t));G.lastT=t;
  update(dt);drawCourt();paintMsg();
  animFrame=requestAnimationFrame(gameLoop);
}
function paintScore(){
  var a=document.getElementById("myScore"),b=document.getElementById("oppScore"),r=document.getElementById("rallyCnt");
  if(a)a.textContent=G.a;if(b)b.textContent=G.b;if(r)r.textContent="랠리 "+G.n+" · 목표 "+G.T;
}
function paintMsg(){
  var m=document.getElementById("matchMsg");if(m){var txt=G.flash&&now()<G.flash.until?G.flash.t:G.msg;if(m.textContent!==txt)m.textContent=txt}
  var e=document.getElementById("effects");if(!e)return;
  var c=[],good=function(t){c.push('<span class="chip game">'+t+'</span>')},bad=function(t){c.push('<span class="chip" style="border-color:#6B3328;color:var(--warn)">'+t+'</span>')};
  if(G.eff.scout>0)good("약점 집중 "+G.eff.scout);if(G.eff.smash>0)good("스매시 "+G.eff.smash);if(G.eff.calm>0)good("평정심 "+G.eff.calm);
  if(G.eff.lucky>0)good("실수 0% "+G.eff.lucky);if(G.eff.coord>0)good("좌표 공격 "+G.eff.coord);if(G.eff.wave>0)good("파동 "+G.eff.wave);
  if(G.eff.slowOpp>0)good("상대 감속 "+G.eff.slowOpp);if(G.eff.boost>0)good("내 속도 ×2 "+G.eff.boost);if(G.oppEff.bound>0)good("부등식 영역 "+G.oppEff.bound);
  if(G.oppEff.fast>0)bad("상대 강타 "+G.oppEff.fast);if(G.oppEff.calm>0)bad("상대 평정 "+G.oppEff.calm);if(G.oppEff.slowMe>0)bad("내 감속 "+G.oppEff.slowMe);
  if(G.sealed)bad("내 스킬 봉인");
  if(G.opp.stamina==="약함"&&G.n>=30)good(G.opp.nm+" 체력 저하");if(G.me.stamina==="약함"&&G.n>=30)bad("내 체력 저하");
  var h=c.join("");if(e.innerHTML!==h)e.innerHTML=h;
}
function drawCourt(){
  var ctx=G.ctx;if(!ctx)return;
  var SC=G.SC,M=G.M,X=function(x){return M+x*SC},Y=function(y){return M+y*SC};
  ctx.clearRect(0,0,G.cv.width,G.cv.height);
  ctx.fillStyle="#173A2B";ctx.fillRect(X(0),Y(0),CW*SC,CL*SC);
  /* 상대 약점 구역 */
  var bz=ZONE[G.opp.bad];
  if(bz){var zy=bz==="앞쪽"?[NET-2.0,NET]:bz==="뒤쪽"?[0,1.6]:[1.6,NET-2.0];ctx.fillStyle=G.eff.scout>0?"rgba(240,121,91,.30)":"rgba(240,121,91,.13)";ctx.fillRect(X(0),Y(zy[0]),CW*SC,(zy[1]-zy[0])*SC)}
  /* 코트 라인: 바깥선, 단식 사이드라인, 숏 서비스 라인, 복식 롱 서비스 라인, 센터 라인 */
  ctx.strokeStyle="#EEF3EF";ctx.lineWidth=2;ctx.strokeRect(X(0),Y(0),CW*SC,CL*SC);ctx.lineWidth=1.2;
  [[0.46,0,0.46,CL],[CW-0.46,0,CW-0.46,CL],[0,NET-1.98,CW,NET-1.98],[0,NET+1.98,CW,NET+1.98],[0,0.76,CW,0.76],[0,CL-0.76,CW,CL-0.76],[CW/2,0,CW/2,NET-1.98],[CW/2,NET+1.98,CW/2,CL]].forEach(function(l){ctx.beginPath();ctx.moveTo(X(l[0]),Y(l[1]));ctx.lineTo(X(l[2]),Y(l[3]));ctx.stroke()});
  /* 네트 */
  ctx.strokeStyle="#FFB547";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(X(-0.15),Y(NET));ctx.lineTo(X(CW+0.15),Y(NET));ctx.stroke();
  /* 조준점 */
  ctx.lineWidth=2;var ax=X(G.aim.x),ay=Y(G.aim.y);ctx.beginPath();ctx.moveTo(ax-9,ay);ctx.lineTo(ax+9,ay);ctx.moveTo(ax,ay-9);ctx.lineTo(ax,ay+9);ctx.stroke();
  var t=now();
  /* 셔틀 착지 원 + 타이밍 링 */
  if(G.fly&&!G.fly.mine&&G.phase==="incoming"){
    var f=G.fly,rem=Math.max(0,f.t0+f.tf-t);
    ctx.strokeStyle="#EEF3EF";ctx.setLineDash([4,4]);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X(f.to.x),Y(f.to.y),REACH*SC,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=rem<0.09?"#3FA877":"#FFB547";ctx.lineWidth=3;ctx.beginPath();ctx.arc(X(f.to.x),Y(f.to.y),REACH*SC*(1+rem*2.2),0,Math.PI*2);ctx.stroke();
  }
  /* 셔틀콕 */
  if(G.fly){var f2=G.fly,k=Math.min(1,(t-f2.t0)/f2.tf),px=f2.from.x+(f2.to.x-f2.from.x)*k,py=f2.from.y+(f2.to.y-f2.from.y)*k,h=Math.sin(Math.PI*k)*(f2.type==="스매시"?8:22),fast=(f2.mult||1)>=2;
    ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(X(px),Y(py),5,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=fast?"#EF4444":"#FFFFFF";ctx.beginPath();ctx.arc(X(px),Y(py)-h,fast?6:5,0,Math.PI*2);ctx.fill()}
  /* 선수 + 팔 길이 */
  ctx.strokeStyle="rgba(255,181,71,.35)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(X(G.mePos.x),Y(G.mePos.y),REACH*SC,0,Math.PI*2);ctx.stroke();
  function dot(p,col,label){ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(p.x),Y(p.y),11,0,Math.PI*2);ctx.fill();ctx.fillStyle="#0E1915";ctx.font="bold 12px 'IBM Plex Sans KR',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label,X(p.x),Y(p.y)+1)}
  dot(G.opPos,G.opp.col,G.opp.nm.charAt(0));dot(G.mePos,"#FFB547",G.me.nm.charAt(0));
  if(G.swing&&t-G.swing.t<0.6){ctx.fillStyle=G.swing.miss?"#F0795B":G.swing.Q===1?"#3FA877":"#FFB547";ctx.font="bold 15px 'IBM Plex Sans KR',sans-serif";ctx.textAlign="center";ctx.fillText(G.swing.miss?"헛스윙":G.swing.Q===1?"완벽":G.swing.Q===0.7?"좋음":"늦음",X(G.mePos.x),Y(G.mePos.y)-22)}
}

function finishMatch(iWon){
  cancelAnimationFrame(animFrame);
  var earnedPts = iWon ? 150 : 30;
  S.pts += earnedPts;
  S.games += 1;
  if(iWon) S.wins += 1;

  // 명예의 전당 점수 등록 (자동 반영)
  S.hall.push({
    name: S.nick || "익명",
    charNm: getChar(S.char).nm,
    pts: S.pts,
    games: S.games
  });

  saveGame();
  S.screen = "result";
  S.lastResult = { iWon: iWon, earnedPts: earnedPts };
  render();
}

/* ================= 7. 경기 결과 화면 ================= */
function renderResult(app){
  var res = S.lastResult;
  var html = `
  <div class="panel" style="text-align:center">
    <span class="eyebrow">MATCH RESULT</span>
    <h1>${res.iWon ? '🎉 승리했습니다!' : '패배했습니다...'}</h1>
    <p style="font-size:18px">획득 포인트: <b class="led">+${res.earnedPts} PT</b></p>
    <p class="muted">총 누적 포인트: ${S.pts} PT | 총 경기수: ${S.games}경기</p>
    
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="primary" id="againBtn">같은 상대와 다시</button>
      <button id="goSelectBtn">캐릭터 선택 / 홈으로</button>
    </div>
  </div>
  ` + surveyHtml() + resultDetailHtml();
  app.innerHTML = html;
  bindSurvey();
  document.getElementById("againBtn").onclick = () => { newCond(); S.sv = null; S.screen = "guess"; render(); };
  document.getElementById("goSelectBtn").onclick = () => {
    S.screen = "select";
    render();
  };
}

/* ================= 초기화 ================= */
document.getElementById("homeBtn").onclick = () => {
  S.screen = "select";
  render();
};

initGame();
render();

})();
</script>
