<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>수학자를 이겨라</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
/* 레이아웃: 체육관 전광판. 맨 위 고정 바, 가운데 현재 장면. 경기 화면은 위에서 본 코트(캔버스) + 조작 패드. 단일 다크 테마. */
:root{
  --floor:#0E1915; --panel:#16241E; --panel-2:#1D2F27; --line:#2C4338;
  --chalk:#EEF3EF; --muted:#A3B5AB; --led:#FFB547; --court:#3FA877; --warn:#F0795B; --strong:#C9A7FF;
  --font-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-led:"Share Tech Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--floor);color:var(--chalk);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0A130F}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0A130F;border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.topbar .in{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-size:20px;background:none;border:0;color:var(--chalk);padding:0;min-height:44px;cursor:pointer}
.brand span{color:var(--led)}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 0}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(36px,8vw,60px);line-height:1.05}
h2{font-size:clamp(22px,4vw,28px);line-height:1.2}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.led{font-family:var(--font-led);color:var(--led);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-led);font-size:13px;letter-spacing:.12em;color:var(--court);text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
button{font-family:var(--font-body);font-size:15px;font-weight:700;border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--chalk);touch-action:manipulation}
button:hover{border-color:var(--court)}
button.primary{background:var(--led);color:#1A1205;border-color:var(--led)}
button.ghost{background:transparent}
button[aria-pressed="true"]{border-color:var(--led);color:var(--led)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible,canvas:focus-visible{outline:2px solid var(--led);outline-offset:2px}
label{font-size:14px;color:var(--muted)}
input[type=text],input[type=tel]{font:inherit;color:var(--chalk);background:var(--floor);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
input[type=range]{width:100%;accent-color:var(--led)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.check{display:flex;gap:10px;align-items:center;color:var(--chalk);font-size:15px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--led)}
details.consent{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--floor)}
details.consent summary{cursor:pointer;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-family:var(--font-led)}
table.plain th{vertical-align:top;width:7em}
table.plain td{white-space:normal}
.tablewrap{overflow-x:auto}
.note{border-left:3px solid var(--led);padding:8px 12px;background:var(--panel-2);border-radius:0 6px 6px 0;font-size:14px}
.court-art{width:100%;height:auto;max-width:100%}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:var(--led);box-shadow:0 0 0 1px var(--led) inset}
.card.locked{opacity:.7}
.card .side{font-family:var(--font-led);font-size:12px;letter-spacing:.1em}
.side.weak{color:var(--court)} .side.strong{color:var(--strong)}
.card .nm{font-family:var(--font-display);font-size:21px;line-height:1.15}
.head{display:flex;gap:12px;align-items:center}
.avatar{flex:0 0 52px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:22px;color:#0E1915;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.bar{height:6px;background:var(--floor);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--court)}
.bar.strong i{background:var(--strong)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--floor)}
.chip.ref{border-color:#6B5A2A;color:#FFD48A}
.chip.game{border-color:#2F5E48;color:#9BE0BC}
.chip.bad{border-color:#6B3328;color:var(--warn)}
.predict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.predict{grid-template-columns:repeat(2,minmax(0,1fr))}}
.predict div{background:var(--floor);border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.predict .big{font-family:var(--font-led);font-size:22px;color:var(--led)}
.predict .lab{color:var(--muted);font-size:13px}
.opt{display:flex;flex-direction:column;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0;text-align:left}
.opt.sel{border-color:var(--led)}
.opt small{color:var(--muted);font-size:13px;line-height:1.5;font-weight:400}
.guess{font-family:var(--font-led);font-size:56px;color:var(--led);line-height:1;text-align:center}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vs div{background:var(--floor);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center}
.vs .big{font-family:var(--font-led);font-size:40px;line-height:1.1}
.big-msg{font-family:var(--font-display);font-size:clamp(28px,6vw,42px);color:var(--led)}
.unlock{border:1px solid var(--strong);background:rgba(201,167,255,.08);border-radius:8px;padding:12px 14px}

/* 경기 화면 */
.arena{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.arena{grid-template-columns:minmax(0,1fr)}}
.courtwrap{position:relative;width:100%;max-width:400px;margin:0 auto}
canvas#court{display:block;width:100%;height:auto;background:#123327;border-radius:8px;touch-action:none}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;background:#07100C;border:2px solid var(--line);border-radius:10px;padding:10px}
.score .s{font-family:var(--font-led);font-size:clamp(40px,10vw,64px);line-height:1;color:var(--led);text-align:center}
.score .n{text-align:center;font-size:14px}
.score .m{font-family:var(--font-led);font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center}
.pad button{padding:0;font-size:22px;min-height:56px}
.hit{font-size:20px;min-height:64px;width:100%}
.assist-toggle{width:100%;min-height:50px;border-color:var(--court)}.assist-toggle[aria-pressed="true"]{background:#214D38;color:#B8F2D0;border-color:#3FA877}
.mobile-help{font-size:13px;color:var(--muted);line-height:1.5}.pad button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media(max-width:640px){.pad{grid-template-columns:repeat(3,minmax(64px,1fr));grid-template-rows:repeat(3,58px);width:100%;gap:8px}.pad button{min-height:58px;font-size:25px}.hit{min-height:72px;font-size:22px}.arena{gap:12px}.courtwrap{max-width:360px}}
.callout{min-height:28px;font-size:15px;text-align:center}
.effects{display:flex;flex-wrap:wrap;gap:6px;min-height:24px}
.keys{font-size:13px;color:var(--muted)}
kbd{font-family:var(--font-led);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--chalk);background:var(--floor)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="topbar"><div class="in">
  <button class="brand" id="homeBtn" type="button" aria-label="처음 화면으로">수학자를 <span>이겨라</span></button>
  <button class="ghost" id="adminBtn" type="button">관리자 로그인</button>
</div></header>
<main class="main"><div class="wrap" id="app" aria-live="polite"></div></main>

<script>
(function(){
"use strict";
var RETENTION="탐구 종료일(2027년 2월 28일)";
var UNLOCK={points:1000,games:20};
/* 깃허브 페이지에서 기록을 모으려면 구글 Apps Script 웹 앱 주소를 넣는다. Claude 아티팩트 안에서는 쓰지 않는다. */
var ENDPOINT="";

/* ================= 수학: 흡수 마르코프 체인 ================= */
function exactAB(q,T,hA,hB){
  var cap=T+9,W={},E={};
  function f(a,b){
    var k=a*100+b; if(k in W) return k;
    var w,e;
    if(a>=cap){w=1;e=0}else if(b>=cap){w=0;e=0}
    else if(a>=T&&a-b>=2){w=1;e=0}else if(b>=T&&b-a>=2){w=0;e=0}
    else{var A=f(a+1,b),B=f(a,b+1);w=q*W[A]+(1-q)*W[B];e=1+q*E[A]+(1-q)*E[B]}
    W[k]=w;E[k]=e;return k;
  }
  var k=f(hA,hB);return {win:W[k],rallies:E[k]};
}
var fairCache={};
function fairRule(p){p=Math.max(p,1-p);var key=p.toFixed(3);if(fairCache[key])return fairCache[key];
  var bs=1e9,out=null;
  for(var T=11;T<=40;T++)for(var h=0;h<T-1;h++){var s=exactAB(p,T,0,h),sc=Math.abs(s.win-0.5)*10+Math.abs(s.rallies-37.2)/37.2;if(sc<bs){bs=sc;out={T:T,h:h}}}
  return fairCache[key]=out}
function headFor(p,T){p=Math.max(p,1-p);var best=0,bd=1;for(var h=0;h<T-1;h++){var d=Math.abs(exactAB(p,T,0,h).win-0.5);if(d<bd){bd=d;best=h}}return best}

/* ================= 캐릭터 ================= */
var SK={
  head:{kind:"ref",nm:"선취점 요청",desc:"약자 선취점을 제안. 내 승률이 55%를 넘으면 심판이 거절한다."},
  short:{kind:"ref",nm:"목표점수 단축",desc:"11점 게임을 제안. 랠리가 적을수록 실력 차의 증폭이 약해진다(×5.3 → ×3.9)."},
  both:{kind:"ref",nm:"양방향 비대칭 목표",desc:"목표점수를 늘리고 약자에게 선취점을 주는 계산상 최적 규칙."},
  serve:{kind:"ref",nm:"첫 서브 요청",desc:"첫 서브를 가져온다. 실제 경기 분석에서 서버의 랠리 승률은 49.6%였다."},
  timeout:{kind:"game",nm:"타임아웃",desc:"상대의 흐름(3연속 득점 뒤 속도 +10%)을 5랠리 동안 끊는다."},
  stamina:{kind:"game",nm:"체력전 유도",desc:"체력이 약한 상대는 지금부터 10랠리 뒤 이동 속도가 15% 느려진다."},
  scout:{kind:"game",nm:"약점 집중",desc:"3랠리 동안 상대 약점 구역으로 보낸 셔틀콕이 더 받기 어려워진다."},
  smash:{kind:"game",nm:"스매시 연타",desc:"3랠리 동안 내 샷이 빨라지고 정확해진다."},
  calm:{kind:"game",nm:"평정심",desc:"4랠리 동안 내 실수 확률이 절반이 된다."}
};
var ZONE={"클리어":"뒤쪽","드롭":"앞쪽","헤어핀":"앞쪽","스매시":"가운데"};
var WEAK=[
  {id:"w1",nm:"파스칼",title:"파스칼의 삼각형",s:-1.3,col:"#C2D0A0",good:"헤어핀",bad:"스매시",stamina:"약함",flow:true,skills:["serve","scout"],
   sk:{serve:{nm:"파스칼의 내기",why:"손해 볼 것 없는 쪽에 걸라는 파스칼의 내기. 효과는 작아도 첫 서브부터 챙긴다."},scout:{nm:"삼각형 배치",why:"파스칼의 삼각형처럼 경우의 수를 펼쳐 상대 약점 구역을 노린다."}},
   line:"모든 경우의 수를 세어 두지만 라켓은 아직 무겁다."},
  {id:"w2",nm:"페르마",title:"확률론의 공동 창시자",s:-1.2,col:"#9FB8AA",good:"클리어",bad:"헤어핀",stamina:"강함",flow:false,skills:["head","timeout"],
   sk:{head:{nm:"점수 분배 문제",why:"파스칼과 함께 '중단된 경기의 판돈을 어떻게 나눌까'를 풀며 확률론을 연 페르마. 남은 경기의 승률을 계산해 선취점을 요구한다."},timeout:{nm:"마지막 정리",why:"358년을 버틴 정리처럼 끈질기게 버티며 상대 흐름을 끊는다."}},
   line:"이 경기의 승률은 내가 제일 먼저 계산했다."},
  {id:"w3",nm:"베르누이",title:"큰 수의 법칙",s:-1.1,col:"#B8C78F",good:"드롭",bad:"스매시",stamina:"약함",flow:false,skills:["short","timeout"],
   sk:{short:{nm:"큰 수의 법칙",why:"시행이 많을수록 결과가 실력대로 수렴한다는 걸 증명한 베르누이. 그래서 약자는 경기를 짧게 줄여야 한다는 것도 안다."},timeout:{nm:"기댓값 재계산",why:"흐름이 넘어가면 잠시 멈추고 기댓값을 다시 계산한다."}},
   line:"길게 가면 진다는 걸 수학으로 안다."},
  {id:"w4",nm:"콜모고로프",title:"확률의 공리화",s:-1.0,col:"#A9C98F",good:"드롭",bad:"클리어",stamina:"보통",flow:false,skills:["both","scout"],
   sk:{both:{nm:"확률의 공리",why:"확률을 공리부터 다시 세운 콜모고로프. 경기 규칙도 처음부터 다시 짜서 목표점수와 선취점을 함께 바꾸자고 한다."},scout:{nm:"복잡도 분석",why:"상대 움직임에서 가장 단순한 패턴, 곧 빈틈을 찾는다."}},
   line:"규칙부터 다시 세우자."},
  {id:"w5",nm:"마르코프",title:"마르코프 체인",s:-0.9,col:"#8FC7A2",good:"클리어",bad:"드롭",stamina:"보통",flow:false,skills:["both","timeout","stamina"],
   sk:{both:{nm:"상태 전이 계산",why:"점수 상태가 옮겨 가는 확률을 끝까지 계산해, 승률 50%에 가장 가까운 규칙을 정확히 찾아낸다. 이 게임의 승률 계산도 그의 방법이다."},timeout:{nm:"무기억성",why:"다음 상태는 지금 상태만으로 정해진다는 마르코프 성질. 지난 연속 실점은 잊고 흐름을 초기화한다."},stamina:{nm:"정상 상태 지구전",why:"충분히 오래 가면 정상 분포에 도달하듯, 랠리를 길게 끌어 상대 체력을 뺀다."}},
   line:"다음 점수는 지금 점수만 보면 된다."},
  {id:"w6",nm:"라플라스",title:"확률의 해석적 이론",s:-0.8,col:"#7FB89A",good:"스매시",bad:"헤어핀",stamina:"보통",flow:true,skills:["head","stamina"],
   sk:{head:{nm:"계승의 법칙",why:"지금까지의 성공 횟수로 다음 확률을 추정하는 라플라스의 법칙. 그 추정대로 공정한 선취점을 요구한다."},stamina:{nm:"중심극한 지구전",why:"오래 쌓일수록 정규분포로 모인다는 중심극한정리처럼 긴 랠리로 버틴다."}},
   line:"주사위파의 맏형."}
];
var STRONG=[

function skNm(c,k){return c&&c.sk&&c.sk[k]?c.sk[k].nm:SK[k].nm}

function byId(id){var all=WEAK.concat(STRONG);for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i];return WEAK[0]}
function isWeak(c){return c.id.charAt(0)==="w"}
function statPct(s){return Math.round(Math.max(4,Math.min(100,(s+1.6)/3.6*100)))}
function speedOf(s){return 3.7+0.5*s}
function reactOf(s){return 0.3-0.03*s}
function errOf(s){return Math.max(0.015,Math.min(0.1,0.07-0.02*(s+1.5)))}

/* ================= 경기 엔진 (사람·기준 봇·AI 공용) =================
   코트: 폭 5.2m, 길이 13.4m. 상대 y 0~6.7, 나 y 6.7~13.4, 네트 y=6.7. */
var CW=5.2,CL=13.4,NET=6.7,REACH=0.75,HOME_ME={x:2.6,y:10.3},HOME_OP={x:2.6,y:3.1};
var seed=(Date.now()%2147483646)+1;
function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
function gauss(){var u=1-rnd(),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function zoneOfOpp(L){return L.y>NET-2.0?"앞쪽":L.y<1.6?"뒤쪽":"가운데"}
function aiShot(op,from,mePos,eff){
  var w={"클리어":1,"드롭":1,"스매시":from.y<NET-2.5?1:0.3,"헤어핀":from.y>NET-1.8?1.2:0.1};
  w[op.good]*=2.2;
  var tot=0,k;for(k in w)tot+=w[k];var t=rnd()*tot,type="클리어";for(k in w){if(t<w[k]){type=k;break}t-=w[k]}
  var y={"클리어":12.2+rnd()*0.9,"드롭":7.3+rnd()*1.3,"스매시":9.5+rnd()*2.5,"헤어핀":6.95+rnd()*0.6}[type];
  var away=rnd()<Math.min(0.85,0.55+0.1*(op.s+1.5));
  var x=away?(mePos.x<CW/2?3.4+rnd()*1.5:0.3+rnd()*1.5):0.4+rnd()*4.4;
  var sig=Math.max(0.12,0.45-0.08*(op.s+1.5));
  var L={x:Math.max(0.15,Math.min(CW-0.15,x+gauss()*sig*0.5)),y:Math.max(NET+0.2,Math.min(CL-0.15,y+gauss()*sig*0.5))};
  var tf={"클리어":1.7,"드롭":1.35,"스매시":0.9,"헤어핀":1.2}[type]*(1-0.05*op.s);
  if(eff&&eff.oppFast)tf*=0.92;
  return {type:type,L:L,tf:Math.max(0.65,tf)};
}
function myShot(me,mePos,aim,Q,eff){
  var sig=Math.max(0.15,0.25+0.6*(1-Q)-0.05*(me.s+1.5));
  if(eff&&eff.smash>0)sig*=0.6;
  var L={x:aim.x+gauss()*sig,y:aim.y+gauss()*sig};
  var out=L.x<0||L.x>CW||L.y<0;var net=L.y>NET-0.08;
  var tf=Math.max(0.7,Math.min(1.9,0.95+0.07*dist(mePos,L)-0.35*Q));
  if(eff&&eff.smash>0)tf=Math.max(0.6,tf-0.2);
  return {L:L,tf:tf,out:out,net:net};
}
function oppCanReach(op,opPos,L,tf,eff){
  var v=speedOf(op.s)*(eff&&eff.oppSpeed?eff.oppSpeed:1);
  var r=REACH,z=zoneOfOpp(L);
  if(ZONE[op.bad]===z)r-=eff&&eff.scout>0?0.45:0.25;
  if(ZONE[op.good]===z)r+=0.15;
  return dist(opPos,L)<=v*Math.max(0,tf-reactOf(op.s))+r;
}
function toward(p,goal,d){var D=dist(p,goal);if(D<=d)return {x:goal.x,y:goal.y};return {x:p.x+(goal.x-p.x)/D*d,y:p.y+(goal.y-p.y)/D*d}}
function botAim(opPos){return {x:opPos.x<CW/2?3.8+rnd()*1.0:0.4+rnd()*1.0,y:rnd()<0.5?0.6+rnd()*1.0:NET-1.6+rnd()*0.9}}
function botRally(me,op,meServes){
  var mePos={x:HOME_ME.x,y:HOME_ME.y},opPos={x:HOME_OP.x,y:HOME_OP.y},vMe=speedOf(me.s),vOp=speedOf(op.s);
  var myTurn=meServes,inc=null;
  if(!meServes)inc=aiShot(op,opPos,mePos);
  for(var ex=0;ex<60;ex++){
    if(!myTurn){
      if(dist(mePos,inc.L)>vMe*Math.max(0,inc.tf-reactOf(me.s))+REACH)return 0;
      var dt=gauss()*0.14,Q=Math.abs(dt)<=0.08?1:Math.abs(dt)<=0.18?0.7:0.4;
      if(rnd()<errOf(me.s)*(Q<0.5?1.8:1))return 0;
      mePos={x:inc.L.x,y:inc.L.y};opPos=toward(opPos,HOME_OP,vOp*inc.tf);
      var sh=myShot(me,mePos,botAim(opPos),Q);
      if(sh.out||sh.net)return 0;
      if(!oppCanReach(op,opPos,sh.L,sh.tf,{oppSpeed:1}))return 1;
      if(rnd()<errOf(op.s))return 1;
      opPos={x:sh.L.x,y:sh.L.y};mePos=toward(mePos,HOME_ME,vMe*sh.tf);
      inc=aiShot(op,opPos,mePos);
    }else{
      var sv=myShot(me,mePos,{x:opPos.x<CW/2?3.6:1.6,y:2.0+rnd()*1.5},0.7);
      if(sv.out||sv.net)return 0;
      if(!oppCanReach(op,opPos,sv.L,sv.tf,{oppSpeed:1}))return 1;
      if(rnd()<errOf(op.s))return 1;
      opPos={x:sv.L.x,y:sv.L.y};inc=aiShot(op,opPos,mePos);myTurn=false;
    }
  }
  return rnd()<0.5?1:0;
}
var qCache={};
function baseQ(me,op){
  var k=me.id+op.id;if(qCache[k]!=null)return qCache[k];
  var sv=seed;seed=12345+me.id.charCodeAt(1)*97+op.id.charCodeAt(1)*31;
  var w=0,N=4000;for(var i=0;i<N;i++)w+=botRally(me,op,i%2===0);
  seed=sv;return qCache[k]=w/N;
}

/* ================= 작전 회의 → 짐작 → 컴퓨터 예측 ================= */
function ruleWith(me,opp,ref,h,q){
  var weakIsMe=isWeak(me),pStrong=weakIsMe?1-q:q;
  var R={T:21,hA:0,hB:0,firstServeMe:null,name:"기본 21점",accepted:true,why:""};
  if(!ref)return R;
  if(ref==="short"){R.T=11;R.name="11점 게임"}
  else if(ref==="both"){var f=fairRule(pStrong);R.T=f.T;if(weakIsMe)R.hA=f.h;else R.hB=f.h;R.name=f.T+"점 + 주사위파 "+f.h+"점 선취"}
  else if(ref==="head"){if(weakIsMe)R.hA=h;else R.hB=h;R.name="21점 + 주사위파 "+h+"점 선취"}
  else if(ref==="serve"){R.firstServeMe=weakIsMe;R.name="기본 21점 · 주사위파 첫 서브"}
  var wWeak=exactAB(1-pStrong,R.T,0,weakIsMe?R.hA:R.hB).win;
  if(wWeak>0.55){R.accepted=false;R.why="심판: 주사위파 승률이 "+pct(wWeak)+"가 되어 거꾸로 불공정하다. 받아들일 수 없다."}
  return R;
}
function aiProposal(me,opp,q){var best=null,bw=2;
  opp.skills.filter(function(k){return SK[k].kind==="ref"}).forEach(function(k){
    var R=ruleWith(me,opp,k,k==="head"?headFor(q,21):0,q);if(!R.accepted)return;
    var w=exactAB(q,R.T,R.hA,R.hB).win;if(w<bw){bw=w;best={k:k,R:R}}});
  return best}
function renderPlan(){
  var me=byId(S.P.char),opp=byId(S.opp),weak=isWeak(me),q=baseQ(me,opp);
  var refs=me.skills.filter(function(k){return SK[k].kind==="ref"});
  var R,ai=null,body="";
  if(weak){
    if(S.refSkill==="head"&&!S.headH)S.headH=Math.min(headFor(q,21),18);
    R=ruleWith(me,opp,S.refSkill,S.headH,q);
    body='<div class="grid2"><button class="opt'+(S.refSkill===null?" sel":"")+'" id="ref-none" aria-pressed="'+(S.refSkill===null)+'"><b>제안하지 않음</b><small>기본 21점 규칙으로 경기한다.</small></button>'+
      refs.map(function(k){return '<button class="opt'+(S.refSkill===k?" sel":"")+'" id="ref-'+k+'" aria-pressed="'+(S.refSkill===k)+'"><b>'+esc(skNm(me,k))+'</b><small>'+esc(skWhy(me,k))+'</small><small>효과: '+esc(SK[k].desc)+'</small></button>'}).join("")+'</div>';
    if(S.refSkill==="head")body+='<div class="field"><label for="hh">요청할 선취점: <span class="led">'+S.headH+'</span>점</label><input type="range" id="hh" min="1" max="19" value="'+S.headH+'"></div>';
    if(!R.accepted)body+='<div class="note" style="border-color:var(--warn)">'+esc(R.why)+' 이대로 진행하면 기본 21점으로 경기한다.</div>';
  }else{
    ai=aiProposal(me,opp,q);R=ai?ai.R:ruleWith(me,opp,null,0,q);
    body=ai?'<div class="note">상대 '+esc(opp.nm)+'이(가) 심판에게 <b>'+esc(SK[ai.k].nm)+'</b>을(를) 제안했고 받아들여졌다. 규칙: '+esc(R.name)+'.</div>':'<div class="note">상대가 쓸 수 있는 심판 제안이 없다.</div>';
  }
  var useR=R.accepted?R:ruleWith(me,opp,null,0,q);
  var games=me.skills.filter(function(k){return SK[k].kind==="game"});
  app.innerHTML=
  '<div class="panel"><div class="row" style="justify-content:space-between"><div><span class="eyebrow">작전 회의</span><h2>'+esc(me.nm)+' vs '+esc(opp.nm)+'</h2></div><button id="back">상대 다시 고르기</button></div>'+
  '<div class="grid2">'+charCard(me,{})+charCard(opp,{})+'</div></div>'+
  '<div class="panel"><span class="eyebrow">'+(weak?"심판에게 제안하기 (한 번)":"상대의 심판 제안")+'</span>'+body+
  '<p class="muted" style="font-size:14px">적용될 규칙: <b style="color:var(--chalk)">'+esc(useR.name)+'</b></p>'+
  '<div><div class="muted" style="font-size:13px;margin-bottom:6px">경기 중 내 스킬 (각 한 번)</div>'+(games.length?'<div class="chips">'+games.map(function(k){return '<span class="chip game">'+esc(skNm(me,k))+' · '+esc(SK[k].desc)+'</span>'}).join("")+'</div>':'<p class="muted" style="font-size:13px">없음</p>')+'</div>'+
  '<div class="row"><button class="primary" id="next">승률 짐작하러 가기</button></div></div>';
  on("back",function(){S.screen="opp";render()});
  if(weak){
    on("ref-none",function(){S.refSkill=null;renderPlan()});
    refs.forEach(function(k){on("ref-"+k,function(){S.refSkill=k;S.headH=0;renderPlan()})});
    var hh=document.getElementById("hh");if(hh)hh.addEventListener("change",function(){S.headH=+hh.value;renderPlan()});
  }
  on("next",function(){
    var ex=exactAB(q,useR.T,useR.hA,useR.hB);
    S.plan={me:me,opp:opp,q:q,R:useR,ex:ex,refUsed:weak&&R.accepted?S.refSkill:null,refRejected:weak&&!R.accepted?S.refSkill:null,aiRef:ai?ai.k:null};
    S.screen="guess";render();
  });
}

  on("direct",function(){startMatch("direct")});

/* ================= 실시간 경기 ================= */
var G=null,raf=null,keys={};
function stopGame(){if(raf){cancelAnimationFrame(raf);raf=null}if(G&&G.pending){clearTimeout(G.pending);G.pending=null}}
function startMatch(mode){
  var pl=S.plan;
  G={mode:mode,me:pl.me,op:pl.opp,R:pl.R,a:pl.R.hA,b:pl.R.hB,n:0,seq:[],servingMe:pl.R.firstServeMe!=null?pl.R.firstServeMe:rnd()<0.5,
     mePos:{x:HOME_ME.x,y:HOME_ME.y},opPos:{x:HOME_OP.x,y:HOME_OP.y},aim:{x:1.2,y:1.2},phase:"idle",fly:null,
     myStreak:0,oppStreak:0,used:{},eff:{timeoutBlock:0,scout:0,smash:0,calm:0,staminaFrom:null},oppUsed:{},oppEff:{fast:0},
     stat:{perfect:0,good:0,late:0,whiff:0,missed:0,err:0,out:0,net:0,winners:0,serveFault:0,netTouch:0,lineCall:0,autoRallies:0},
     msg:"",done:false,pending:null,swing:null,flash:null,assist:!!(window.matchMedia&&window.matchMedia("(max-width: 760px)").matches)};
  S.screen="play";render();
}
function oppSpeedMul(){
  var m=1;
  if(G.op.flow&&G.oppStreak>=3&&G.eff.timeoutBlock<=0)m*=1.1;
  var fs=G.eff.staminaFrom!=null?G.eff.staminaFrom:30;
  if(G.op.stamina==="약함"&&G.n>=fs)m*=0.85;
  return m;
}
function mySpeed(){
  var v=speedOf(G.me.s);
  if(G.me.flow&&G.myStreak>=3)v*=1.1;
  if(G.me.stamina==="약함"&&G.n>=30)v*=0.88;
  return v;

  if(!G.servingMe&&r<errOp){G.stat.serveFault++;return {won:true,msg:G.op.nm+"의 서브 미스. 공짜 득점!"}}
  r=rnd();

function swing(){
  if(!G||G.done||G.mode!=="direct")return;

function myHit(Q,isServe){

  var aim=isServe?{x:G.aim.x,y:Math.min(G.aim.y,NET-2.0)}:G.aim;
  var sh=myShot(G.me,G.mePos,aim,Q,{smash:G.eff.smash});

function point(won){

function autoPoint(){var w=botRally(G.me,G.op,G.servingMe);G.stat.autoRallies++;G.msg="자동 진행: "+(w?"득점":"실점");point(!!w)}
function update(dt){

  if(G.mode==="auto")return;
  var vx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),vy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
  if(vx||vy){var l=Math.hypot(vx,vy),v=mySpeed()*dt;G.mePos.x=Math.max(0.1,Math.min(CW-0.1,G.mePos.x+vx/l*v));G.mePos.y=Math.max(NET+0.3,Math.min(CL-0.1,G.mePos.y+vy/l*v))}

  if(G.phase==="serve"&&t>G.serveDeadline){G.serveDeadline=t+5;G.msg="서브 대기 중. 🏸 치기를 눌러 직접 서브해.";}
  if(G.phase==="incoming"&&G.fly&&t>G.fly.t0+G.fly.tf+0.25){
    G.stat.missed++;G.msg=dist(G.mePos,G.fly.to)>REACH?"셔틀콕이 바닥에 떨어졌다. 실점.":"치지 못했다. 타점을 놓쳤다. 실점.";point(false);return}

    else{G.opPos=toward(f.oppFrom,f.to,speedOf(G.op.s)*oppSpeedMul()*Math.max(0,(t-f.t0)-reactOf(G.op.s)))}
    if(k>=1){
      if(f.out){G.msg="아웃! 실점.";point(false);return}
      if(!f.reach){G.stat.winners++;G.msg="위너! "+G.op.nm+"이(가) 따라가지 못했다.";point(true);return}
      if(rnd()<errOf(G.op.s)){G.msg=G.op.nm+"의 실수! 득점.";point(true);return}
      G.opPos={x:f.to.x,y:f.to.y};oppHit();

function settle(over){
  stopGame();
  var pl=S.plan,P=S.P,won=over===1,weak=isWeak(G.me);
  var humanRallies=G.n-G.stat.autoRallies;
  var humanWins=0;for(var i=0;i<humanRallies;i++)humanWins+=G.seq[i]||0;
  var rate=humanRallies?humanWins/humanRallies:null;
  var skillPts=(rate!=null&&humanRallies>=8)?Math.round(500*(rate-pl.q)):0;
  var winPts=won?Math.round(100*(1-pl.ex.win)):0;
  var guessPts=pl.guessPts||0;
  var total=Math.max(0,guessPts+skillPts+winPts);
  P.games++;if(won)P.wins++;if(weak){P.weakGames++;if(won)P.weakWins++}
  P.points+=total;
  if(won&&weak&&P.beaten.indexOf(G.op.id)<0)P.beaten.push(G.op.id);
  var rec={at:new Date().toISOString(),side:weak?"weak":"strong",mode:G.stat.autoRallies===0?"direct":humanRallies>0?"mixed":"auto",
    me:G.me.id,meS:G.me.s,opp:G.op.id,oppS:G.op.s,q:+pl.q.toFixed(4),T:G.R.T,hA:G.R.hA,hB:G.R.hB,
    ref:pl.refUsed,refRejected:pl.refRejected,aiRef:pl.aiRef,guess:+pl.guess.toFixed(2),predWin:+pl.ex.win.toFixed(4),predRallies:+pl.ex.rallies.toFixed(1),
    a:G.a,b:G.b,rallies:G.n,won:won,humanRallies:humanRallies,humanRate:rate==null?null:+rate.toFixed(4),
    perfect:G.stat.perfect,good:G.stat.good,late:G.stat.late,whiff:G.stat.whiff,missed:G.stat.missed,err:G.stat.err,out:G.stat.out,net:G.stat.net,winners:G.stat.winners,
    serveFault:G.stat.serveFault,netTouch:G.stat.netTouch,lineCall:G.stat.lineCall,
    skills:Object.keys(G.used).map(function(k){return k+"@"+G.used[k]}).join(" "),
    pts:{guess:guessPts,skill:skillPts,win:winPts,total:total},seq:G.seq.join("")};
  P.matches.push(rec);if(P.matches.length>150)P.matches=P.matches.slice(-150);
  use("db").then(function(db){if(!db)sendRemote(Object.assign({type:"match",nick:S.nick||"익명",player:S.playerId},flatRec(rec)))});
  var opened=checkUnlock();
  S.last={rec:rec,opened:opened};
  saveProgress();
  S.screen=opened?"unlock":"result";render();
}

function drawHall(rows){
  var el=document.getElementById("hall");if(!el)return;

function loadHall(){
  getDb().then(function(db){
    if(!db){
      if(ENDPOINT){fetch(ENDPOINT+"?action=hall").then(function(r){return r.json()}).then(drawHall).catch(function(){})}
      else{var el=document.getElementById("hall");if(el)el.innerHTML='<p class="muted" style="font-size:14px">명예의 전당은 기록 서버가 연결된 경우에만 보인다.</p>'}
      return;
    }
    if(hallUnsub){hallUnsub();hallUnsub=null}
    hallUnsub=db.collection("hall3").orderBy("points","desc").limit(15).onSnapshot(function(snap){drawHall(snap.docs.map(function(d){return d.data()}))},function(){});

function submitHall(){
  var btn=document.getElementById("submit"),msg=document.getElementById("hallMsg");
  if(btn)btn.disabled=true;
  var row={nick:(S.nick||"").slice(0,16),points:S.P.points,games:S.P.openGames,at:new Date().toISOString()};
  getDb().then(function(db){
    if(!db){

      return;

function avg(a,f){return a.length?a.reduce(function(s,x){return s+f(x)},0)/a.length:null}
function allMatches(){var out=[];adminRows.forEach(function(u){(u.game3.matches||[]).forEach(function(m){out.push({u:u,m:m})})});out.sort(function(x,y){return (y.m.at||"").localeCompare(x.m.at||"")});return out}
function h1(L){
  var d=L.filter(function(x){return x.m.humanRate!=null&&x.m.humanRallies>=8});
  return ["weak","strong"].map(function(side){var g=d.filter(function(x){return x.m.side===side});
    return {side:side==="weak"?"주사위파":"방정식파",n:g.length,q:avg(g,function(x){return x.m.q}),h:avg(g,function(x){return x.m.humanRate}),pred:avg(g,function(x){return x.m.predWin}),act:avg(g,function(x){return x.m.won?1:0})}});
}
function h2(L){
  return [[0,.1],[.1,.3],[.3,.5],[.5,.7],[.7,.9],[.9,1.01]].map(function(b){var g=L.filter(function(x){return x.m.predWin>=b[0]&&x.m.predWin<b[1]&&x.m.guess!=null});
    return {range:Math.round(b[0]*100)+"~"+Math.min(100,Math.round(b[1]*100))+"%",n:g.length,pred:avg(g,function(x){return x.m.predWin}),guess:avg(g,function(x){return x.m.guess})}});
}
function h3(L){
  var w=L.filter(function(x){return x.m.side==="weak"});
  return ["none","head","short","both","serve"].map(function(k){var g=w.filter(function(x){return (x.m.ref||"none")===k});
    return {nm:k==="none"?"제안 없음":SK[k].nm,n:g.length,share:w.length?g.length/w.length:null,pred:avg(g,function(x){return x.m.predWin}),act:avg(g,function(x){return x.m.won?1:0})}});
}

    var X=x[0],dl=x[1];if(!dl){if(msg)msg.textContent="이 화면에서는 파일을 받을 수 없다.";return}
    var r4=function(v){return v==null?"":+(+v).toFixed(4)};
    var players=adminRows.map(function(u){var p=u.game3;return {"닉네임":u.nick||"익명","최근접속":u.updatedAt||"","경기수":p.games,"승":p.wins,"포인트":p.points,"방정식파열림":!!p.strongOpen,"연경기수":p.openGames||"","이긴방정식파":(p.beaten||[]).map(function(id){return byId(id).nm}).join(", ")}});
    var matches=L.map(function(x){var m=x.m;return {"시각":m.at,"닉네임":x.u.nick||"익명","방식":{direct:"직접",mixed:"직접+자동",auto:"자동"}[m.mode],"내쪽":m.side==="weak"?"주사위파":"방정식파","내캐릭터":byId(m.me).nm,"내능력s":m.meS,"상대":byId(m.opp).nm,"상대능력s":m.oppS,"기준랠리승률p":m.q,"심판제안":m.ref?SK[m.ref].nm:"","거절된제안":m.refRejected?SK[m.refRejected].nm:"","상대제안":m.aiRef?SK[m.aiRef].nm:"","목표점수":m.T,"내선취":m.hA,"상대선취":m.hB,"짐작승률":m.guess,"예상승률":m.predWin,"예상랠리수":m.predRallies,"내점수":m.a,"상대점수":m.b,"랠리수":m.rallies,"승리":m.won,"직접랠리수":m.humanRallies,"사람랠리승률":r4(m.humanRate),"완벽":m.perfect,"좋음":m.good,"늦음":m.late,"헛스윙":m.whiff,"놓침":m.missed,"실수":m.err,"아웃":m.out,"네트":m.net,"위너":m.winners,"서브미스":m.serveFault,"네트터치":m.netTouch,"스킬(스킬@랠리)":m.skills,"짐작점수":m.pts.guess,"실력점수":m.pts.skill,"승리점수":m.pts.win,"총포인트":m.pts.total,"랠리순서(1=내득점)":m.seq}});
    var H1=h1(L).map(function(r){return {"내쪽":r.side,"경기수":r.n,"기준p":r4(r.q),"사람랠리승률":r4(r.h),"예상게임승률":r4(r.pred),"실제게임승률":r4(r.act)}});
    var H2=h2(L).map(function(r){return {"예상승률구간":r.range,"경기수":r.n,"평균예상":r4(r.pred),"평균짐작":r4(r.guess)}});
    var H3=h3(L).map(function(r){return {"심판제안":r.nm,"경기수":r.n,"선택비율":r4(r.share),"평균예상승률":r4(r.pred),"실제승률":r4(r.act)}});
    var wb=X.utils.book_new();
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(players),"플레이어");
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(matches.length?matches:[{"시각":""}]),"경기별");
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(H1),"H1_사람vs봇");
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(H2),"H2_짐작vs계산");
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(H3),"H3_심판제안");
    var buf=X.write(wb,{type:"array",bookType:"xlsx"}),d=new Date(),pad=function(n){return String(n).padStart(2,"0")};
    return dl.save({filename:"수학자를이겨라_게임기록_"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())+".xlsx",data:buf}).then(function(){if(msg)msg.textContent="엑셀 파일을 받았다 (플레이어 "+players.length+"명, "+matches.length+"경기)."});
  }).catch(function(e){if(msg)msg.textContent=(e&&e.code==="declined")?"받기를 취소했다.":"엑셀 파일을 만들지 못했다."}).then(function(){if(btn)btn.disabled=false});
}

document.getElementById("homeBtn").addEventListener("click",function(){if(adminUnsub){adminUnsub();adminUnsub=null}S.screen=S.loaded?"select":"intro";render()});
document.getElementById("adminBtn").addEventListener("click",function(){
  if(S.isAdmin){if(S.screen!=="admin"){S.prevScreen=(S.screen==="play"?"select":S.screen);S.screen="admin";render()}return}
  adminLogin();
});
if(!(window.claude&&window.claude.use))document.getElementById("adminBtn").hidden=true;
render();
})();
